<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Password Manager</title><link rel="stylesheet" href="popup.css"></head>
<body><main><h1>Password Manager</h1><p id="origin">Checking active website…</p><section id="unlock"><label for="master">Master password</label><input id="master" type="password" autocomplete="current-password"><button id="unlockButton">Unlock local vault</button></section><section id="vault" hidden><button id="refreshButton">Find matching logins</button><button id="openDashboard" class="secondary">Open full vault dashboard</button><div id="results"></div><button id="lockButton" class="secondary">Lock</button></section><p id="status" role="status"></p><small>Autofill runs only after you select a saved login. Matches require an exact hostname match.</small></main><script src="popup.js"></script></body></html>
